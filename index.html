<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile PDF PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #00e676; --text: #ffffff; --border: #333333; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    header { height: 50px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); }
    #viewer { flex: 1; overflow: auto; background: #2a2a2a; display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
    .page-wrapper { position: relative; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    canvas { display: block; background: #ffffff; }
    .annotation-layer { position: absolute; top: 0; left: 0; touch-action: none; pointer-events: none; }
    footer { height: 60px; background: var(--card); display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--border); }
    .btn { background: transparent; border: none; color: var(--text); display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; cursor: pointer; }
    .btn.active { color: var(--accent); }
    #file-input { display: none; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="doc-title" style="font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:65%;">No File Loaded</h1>
    <span id="page-count" style="font-size:12px; color:#aaa;">0/0</span>
  </header>

  <main id="viewer"></main>

  <footer>
    <button class="btn" onclick="document.getElementById('file-input').click()">Import</button>
    <button class="btn" id="draw-btn" onclick="toggleDraw()">Draw</button>
    <button class="btn" onclick="rotatePages()">Rotate</button>
    <button class="btn" onclick="exportPDF()">Export</button>
    <button class="btn" onclick="printPDF()">Print</button>
  </footer>
</div>

<input type="file" id="file-input" accept="application/pdf" onchange="loadFile(event)">

<script>
  
</script>
</body>
</html>
